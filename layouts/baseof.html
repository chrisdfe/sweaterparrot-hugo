<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="site-wrapper">
    {{ partial "header.html" . }}

    {{ block "page-styles" . }}{{ end }}

    <main>
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    {{ block "page-scripts" . }}{{ end }}
  </div>
</body>
</html>
